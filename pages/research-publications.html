
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Publications | SIRI</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .publications-container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 20px;
    }

    .publication-header {
      margin-bottom: 28px;
    }

    .publication-header h1 {
      margin-bottom: 8px;
    }

    .publication-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    .publication-tools input,
    .publication-tools select {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font: inherit;
    }

    .publication-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .publication-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.04);
    }

    .publication-card h3 {
      margin: 10px 0;
    }

    .publication-category {
      display: inline-block;
      background: #eee8ff;
      color: #5935a5;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .publication-meta {
      color: #777;
      font-size: 13px;
      margin: 12px 0;
    }

    .read-button {
      display: inline-block;
      padding: 10px 15px;
      background: #5633a5;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
    }

    .read-button:hover {
      background: #40247f;
    }

    .empty-message {
      padding: 25px;
      text-align: center;
      background: #f8f8fb;
      border-radius: 10px;
      color: #666;
      grid-column: 1 / -1;
    }

    .reader {
      display: none;
      background: white;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      margin-top: 25px;
      line-height: 1.8;
    }

    .reader h2 {
      line-height: 1.3;
    }

    .back-button {
      margin-bottom: 20px;
      background: #eee;
      color: #333;
    }

    .reader-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .status-message {
      margin: 15px 0;
      color: #666;
    }
  </style>
</head>

<body>
  <main class="publications-container">

    <div class="publication-header">
      <p>SOBO RESEARCH AND INTELLIGENCE HUB</p>
      <h1>Research Publications</h1>
      <p>
        Explore research, student insights, analytical articles
        and publications from the School of Business Organizations.
      </p>
    </div>

    <div id="statusMessage" class="status-message">
      Loading publications...
    </div>

    <section id="browseSection">
      <div class="publication-tools">
        <input
          type="search"
          id="searchInput"
          placeholder="Search publications..."
        >

        <select id="categoryFilter">
          <option value="">All categories</option>
          <option value="Research Articles">Research Articles</option>
          <option value="Student Insights">Student Insights</option>
          <option value="Business and Finance">Business and Finance</option>
          <option value="Campus Research">Campus Research</option>
          <option value="Policy and Administration">Policy and Administration</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div id="publicationList" class="publication-list"></div>
    </section>

    <section id="reader" class="reader">
      <button class="read-button back-button" id="backButton">
        ← Back to publications
      </button>

      <span id="readerCategory" class="publication-category"></span>
      <h2 id="readerTitle"></h2>
      <div id="readerMeta" class="publication-meta"></div>
      <p id="readerSummary"></p>
      <hr>
      <div id="readerContent" class="reader-content"></div>
    </section>

  </main>

  <script type="module">
    import { auth, db } from "../js/firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    import {
      collection,
      getDocs,
      query,
      where,
      orderBy
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const statusMessage = document.getElementById("statusMessage");
    const publicationList = document.getElementById("publicationList");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const browseSection = document.getElementById("browseSection");
    const reader = document.getElementById("reader");

    let publications = [];

    function escapeHTML(value = "") {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function formatDate(timestamp) {
      if (!timestamp || typeof timestamp.toDate !== "function") {
        return "Date unavailable";
      }

      return timestamp.toDate().toLocaleDateString("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    async function loadPublications() {
      statusMessage.textContent = "Loading publications...";

      try {
        const publicationsQuery = query(
          collection(db, "publications"),
          where("status", "==", "published"),
          orderBy("publishedAt", "desc")
        );

        const snapshot = await getDocs(publicationsQuery);

        publications = snapshot.docs.map(document => ({
          id: document.id,
          ...document.data()
        }));

        statusMessage.textContent = publications.length
          ? `${publications.length} publication(s) available`
          : "No publications have been published yet.";

        displayPublications();

      } catch (error) {
        console.error("Publication loading error:", error);

        statusMessage.textContent =
          "Unable to load publications. Please refresh the page or contact the SIRI administrator.";
      }
    }

    function displayPublications() {
      const search = searchInput.value.trim().toLowerCase();
      const category = categoryFilter.value;

      const filtered = publications.filter(publication => {
        const searchableText = [
          publication.title,
          publication.author,
          publication.summary,
          publication.content,
          publication.category,
          ...(Array.isArray(publication.keywords)
            ? publication.keywords
            : [])
        ].join(" ").toLowerCase();

        return searchableText.includes(search)
          && (!category || publication.category === category);
      });

      publicationList.innerHTML = "";

      if (!filtered.length) {
        publicationList.innerHTML = `
          <div class="empty-message">
            No matching publications found.
          </div>
        `;
        return;
      }

      filtered.forEach(publication => {
        const card = document.createElement("article");
        card.className = "publication-card";

        card.innerHTML = `
          <span class="publication-category">
            ${escapeHTML(publication.category || "Other")}
          </span>

          <h3>${escapeHTML(publication.title || "Untitled publication")}</h3>

          <p>${escapeHTML(publication.summary || "No summary available.")}</p>

          <div class="publication-meta">
            By ${escapeHTML(publication.author || "SOBO Research Team")}
            <br>
            ${formatDate(publication.publishedAt)}
          </div>

          <button class="read-button">Read publication</button>
        `;

        card.querySelector("button").addEventListener("click", () => {
          openPublication(publication);
        });

        publicationList.appendChild(card);
      });
    }

    function openPublication(publication) {
      browseSection.style.display = "none";
      reader.style.display = "block";

      document.getElementById("readerCategory").textContent =
        publication.category || "Other";

      document.getElementById("readerTitle").textContent =
        publication.title || "Untitled publication";

      document.getElementById("readerMeta").textContent =
        `By ${publication.author || "SOBO Research Team"} · ${formatDate(publication.publishedAt)}`;

      document.getElementById("readerSummary").textContent =
        publication.summary || "";

      document.getElementById("readerContent").textContent =
        publication.content || "No publication content available.";

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("backButton").addEventListener("click", () => {
      reader.style.display = "none";
      browseSection.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    searchInput.addEventListener("input", displayPublications);
    categoryFilter.addEventListener("change", displayPublications);

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "../login.html";
        return;
      }

      try {
        const profileSnapshot = await getDocs(
          query(
            collection(db, "registrationRequests"),
            where("uid", "==", user.uid)
          )
        );

        // The profile document is normally stored using the UID as its ID.
        // Check that document directly if the query returns no result.
        if (profileSnapshot.empty) {
          const { doc, getDoc } = await import(
            "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js"
          );

          const profile = await getDoc(
            doc(db, "registrationRequests", user.uid)
          );

          if (!profile.exists() || profile.data().status !== "active") {
            window.location.href = "../login.html";
            return;
          }
        } else if (profileSnapshot.docs[0].data().status !== "active") {
          window.location.href = "../login.html";
          return;
        }

        await loadPublications();

      } catch (error) {
        console.error(error);
        statusMessage.textContent =
          "We could not verify your student account. Please sign in again.";
      }
    });
  </script>
</body>
</html>

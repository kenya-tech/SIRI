<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061321">
<title>Student Registration | SIRI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#061321;
  --panel:rgba(12,29,48,.88);
  --green:#20c77b;
  --green-light:#65f2b1;
  --blue:#35aaff;
  --cyan:#65e5ff;
  --white:#f5f9ff;
  --muted:#a6b8ce;
  --border:rgba(255,255,255,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:var(--navy);
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px 16px;
  overflow-x:hidden;
  position:relative;
}

#network{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

.background-glow{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 40%,transparent,rgba(3,12,24,.72) 85%),
    linear-gradient(90deg,rgba(4,15,27,.3),transparent,rgba(4,15,27,.3));
}

.container{
  position:relative;
  z-index:2;
  width:100%;
  max-width:490px;
  padding:36px;
  border:1px solid rgba(101,229,255,.15);
  border-radius:20px;
  background:var(--panel);
  backdrop-filter:blur(22px);
  box-shadow:
    0 25px 90px rgba(0,0,0,.4),
    0 0 45px rgba(32,199,123,.06);
  animation:appear .8s ease both;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(22px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:30px;
}

.logo{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(140deg,#087c4b,#2ce69a);
  color:white;
  font-family:'Space Grotesk',sans-serif;
  font-size:27px;
  font-weight:700;
  box-shadow:0 0 25px rgba(32,199,123,.3);
}

.brand h2{
  font-family:'Space Grotesk',sans-serif;
  font-size:23px;
  letter-spacing:1px;
}

.brand small{
  display:block;
  font-size:8px;
  color:#a4bacd;
  letter-spacing:1.7px;
  margin-top:3px;
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--green-light);
  font-size:9px;
  font-weight:700;
  letter-spacing:2px;
  margin-bottom:12px;
}

.eyebrow:before{
  content:"";
  height:1px;
  width:20px;
  background:var(--green-light);
}

h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:29px;
  letter-spacing:-1px;
  margin-bottom:9px;
}

.subtitle{
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
  margin-bottom:24px;
}

label{
  display:block;
  color:#dce8f5;
  font-size:12px;
  font-weight:600;
  margin:17px 0 8px;
}

input,select{
  width:100%;
  padding:13px 14px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  background:rgba(3,15,28,.65);
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  outline:none;
  transition:border-color .25s,box-shadow .25s,background .25s;
}

input::placeholder{
  color:#71859b;
}

input:focus,select:focus{
  border-color:var(--green);
  background:rgba(7,28,40,.9);
  box-shadow:0 0 0 3px rgba(32,199,123,.12);
}

select{
  cursor:pointer;
}

select option{
  background:#10243a;
  color:white;
}

.hint{
  color:#8095a9;
  font-size:10px;
  margin-top:7px;
  line-height:1.5;
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:65px;
}

.toggle-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#79bca0;
  font-size:10px;
  font-weight:700;
  cursor:pointer;
  padding:5px;
}

.toggle-password:hover{
  color:var(--green-light);
}

button[type="submit"]{
  width:100%;
  padding:15px;
  margin-top:25px;
  border:0;
  border-radius:8px;
  background:linear-gradient(110deg,#19b86d,#65f2b1);
  color:#041b13;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(32,199,123,.2);
  transition:.25s;
}

button[type="submit"]:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 35px rgba(32,199,123,.35);
}

button[type="submit"]:disabled{
  opacity:.6;
  cursor:wait;
  transform:none;
}

#message{
  display:none;
  padding:12px 14px;
  border-radius:8px;
  margin-top:17px;
  font-size:12px;
  line-height:1.6;
}

.success{
  display:block!important;
  background:rgba(32,199,123,.12);
  color:#75e8b3;
  border:1px solid rgba(32,199,123,.25);
}

.error{
  display:block!important;
  background:rgba(239,68,68,.10);
  color:#ff9d9d;
  border:1px solid rgba(239,68,68,.2);
}

.bottom{
  text-align:center;
  margin-top:25px;
  color:var(--muted);
  font-size:12px;
}

.bottom a{
  color:var(--green-light);
  font-weight:700;
  text-decoration:none;
}

.bottom a:hover{
  text-decoration:underline;
}

.back{
  display:block;
  text-align:center;
  margin-top:19px;
  color:#8198ad;
  font-size:11px;
  text-decoration:none;
  transition:.2s;
}

.back:hover{
  color:var(--cyan);
}

.security-note{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:24px;
  padding-top:17px;
  border-top:1px solid var(--border);
  color:#758ca2;
  font-size:9px;
  letter-spacing:.5px;
}

.security-note span{
  color:var(--green-light);
}

@media(max-width:520px){
  body{
    padding:20px 12px;
    align-items:flex-start;
  }

  .container{
    padding:27px 21px;
    margin:auto 0;
  }

  h1{
    font-size:26px;
  }

  .brand{
    margin-bottom:25px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<canvas id="network"></canvas>
<div class="background-glow"></div>

<main class="container">

  <div class="brand">
    <div class="logo">S</div>
    <div>
      <h2>SIRI</h2>
      <small>RESEARCH & INTELLIGENCE HUB</small>
    </div>
  </div>

  <div class="eyebrow">JOIN THE SIRI COMMUNITY</div>

  <h1>Create your account.</h1>

  <p class="subtitle">
    Register using your University of Nairobi student details
    to access the SIRI platform.
  </p>

  <form id="registrationForm">

    <label for="registrationNumber">
      University Registration Number
    </label>

    <input
      id="registrationNumber"
      type="text"
      placeholder="Enter your registration number"
      autocomplete="off"
      required
      maxlength="40"
    >

    <label for="year">Year of Study</label>

    <select id="year" required>
      <option value="">Select your year</option>
      <option value="1">Year 1</option>
      <option value="2">Year 2</option>
      <option value="3">Year 3</option>
      <option value="4">Year 4</option>
    </select>

    <label for="course">Programme</label>

    <select id="course" required>
      <option value="">Select your programme</option>
      <option value="B.Com">Bachelor of Commerce (B.Com)</option>
      <option value="PPM">Project Planning and Management (PPM)</option>
    </select>

    <label for="phone">Phone Number</label>

    <input
      id="phone"
      type="tel"
      placeholder="07XXXXXXXX"
      inputmode="numeric"
      maxlength="10"
      pattern="07[0-9]{8}"
      required
    >

    <p class="hint">
      Kenyan mobile number, e.g. 0712345678.
    </p>

    <label for="password">Password</label>

    <div class="password-wrap">
      <input
        id="password"
        type="password"
        placeholder="Create a password"
        autocomplete="new-password"
        minlength="8"
        required
      >
      <button type="button" class="toggle-password" data-target="password">
        SHOW
      </button>
    </div>

    <label for="confirmPassword">Confirm Password</label>

    <div class="password-wrap">
      <input
        id="confirmPassword"
        type="password"
        placeholder="Enter your password again"
        autocomplete="new-password"
        minlength="8"
        required
      >
      <button type="button" class="toggle-password" data-target="confirmPassword">
        SHOW
      </button>
    </div>

    <button type="submit" id="registerButton">
      Create Account <span>↗</span>
    </button>

    <div id="message" role="status" aria-live="polite"></div>

  </form>

  <div class="bottom">
    Already have an account?
    <a href="login.html" id="loginLink">Sign in</a>
  </div>

  <a href="index.html" class="back">
    ← Back to SIRI homepage
  </a>

  <div class="security-note">
    <span>●</span>
    SECURE STUDENT REGISTRATION
  </div>

</main>

<script type="module">
import { auth, db } from "./js/firebase.js";

import {
  createUserWithEmailAndPassword,
  deleteUser
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const form = document.getElementById("registrationForm");
const button = document.getElementById("registerButton");
const message = document.getElementById("message");

/*
  POLL RETURN DESTINATION

  Only accepts a poll URL belonging to this SIRI website.
  Invalid or missing destinations fall back to the dashboard.
*/

function getRegistrationDestination(){

  const next = new URLSearchParams(window.location.search).get("next");

  if(!next){
    return "dashboard.html";
  }

  try{

    const destination = new URL(next,window.location.origin);

    const pollPath = new URL(
      "./poll.html",
      window.location.href
    ).pathname;

    if(
      destination.origin === window.location.origin &&
      destination.pathname === pollPath &&
      destination.searchParams.has("id")
    ){
      return destination.href;
    }

  }catch(error){

    console.error("Invalid return destination:",error);

  }

  return "dashboard.html";
}

/*
  PRESERVE THE POLL LINK WHEN A STUDENT CHOOSES SIGN IN
*/

const loginLink = document.getElementById("loginLink");
const registrationDestination = getRegistrationDestination();

if(registrationDestination !== "dashboard.html"){

  loginLink.href =
    "login.html?next=" +
    encodeURIComponent(registrationDestination);

}

function showMessage(text,type){

  message.textContent=text;
  message.className=type;
  message.style.display="block";

}

async function createInternalEmail(registrationNumber){

  const normalized=registrationNumber
    .trim()
    .toUpperCase()
    .replace(/\s+/g,"");

  const bytes=new TextEncoder().encode(normalized);
  const hash=await crypto.subtle.digest("SHA-256",bytes);

  const hashString=Array.from(new Uint8Array(hash))
    .map(byte=>byte.toString(16).padStart(2,"0"))
    .join("");

  return `student-${hashString}@accounts.siri.invalid`;

}

/* SHOW / HIDE PASSWORD */

document.querySelectorAll(".toggle-password").forEach(toggle=>{

  toggle.addEventListener("click",()=>{

    const input=document.getElementById(toggle.dataset.target);

    if(input.type==="password"){
      input.type="text";
      toggle.textContent="HIDE";
    }else{
      input.type="password";
      toggle.textContent="SHOW";
    }

  });

});

/* REGISTRATION */

form.addEventListener("submit",async(event)=>{

  event.preventDefault();

  message.style.display="none";

  const registrationNumber=
    document.getElementById("registrationNumber").value.trim();

  const year=Number(document.getElementById("year").value);

  const course=document.getElementById("course").value;

  const phone=document.getElementById("phone").value.trim();

  const password=document.getElementById("password").value;

  const confirmPassword=
    document.getElementById("confirmPassword").value;

  if(!registrationNumber){
    showMessage(
      "Enter your university registration number.",
      "error"
    );
    return;
  }

  if(![1,2,3,4].includes(year)){
    showMessage(
      "Select your year of study.",
      "error"
    );
    return;
  }

  if(!["B.Com","PPM"].includes(course)){
    showMessage(
      "Select a valid programme.",
      "error"
    );
    return;
  }

  if(!/^07[0-9]{8}$/.test(phone)){
    showMessage(
      "Enter a valid Kenyan phone number in the format 07XXXXXXXX.",
      "error"
    );
    return;
  }

  if(password.length<8){
    showMessage(
      "Your password must contain at least 8 characters.",
      "error"
    );
    return;
  }

  if(password!==confirmPassword){
    showMessage(
      "Your passwords do not match.",
      "error"
    );
    return;
  }

  button.disabled=true;
  button.textContent="Creating your account...";

  let createdUser=null;

  try{

    const internalEmail=
      await createInternalEmail(registrationNumber);

    const credential=await createUserWithEmailAndPassword(
      auth,
      internalEmail,
      password
    );

    createdUser=credential.user;

    await setDoc(
      doc(db,"registrationRequests",createdUser.uid),
      {
        uid:createdUser.uid,
        registrationNumber:registrationNumber,
        year:year,
        course:course,
        phone:"+254"+phone.substring(1),
        status:"active",
        createdAt:serverTimestamp()
      }
    );

    showMessage(
      "Your SIRI account has been created successfully. Redirecting...",
      "success"
    );

    form.reset();

    window.location.href=getRegistrationDestination();

  }catch(error){

    if(createdUser){

      try{
        await deleteUser(createdUser);
      }catch(cleanupError){
        console.error("Account cleanup failed:",cleanupError);
      }

    }

    console.error(error);

    let errorText="Registration failed. Please try again.";

    if(error.code==="auth/email-already-in-use"){
      errorText="This registration number already has an account.";
    }else if(error.code==="auth/weak-password"){
      errorText="Please choose a stronger password.";
    }else if(error.code==="auth/operation-not-allowed"){
      errorText="Email and password authentication is not enabled in Firebase.";
    }else if(
      error.code==="permission-denied" ||
      error.code==="firestore/permission-denied"
    ){
      errorText="Database permission denied. Please contact the administrator.";
    }else if(error.code==="auth/network-request-failed"){
      errorText="Network error. Check your internet connection.";
    }

    showMessage(errorText,"error");

  }finally{

    button.disabled=false;
    button.innerHTML='Create Account <span>↗</span>';

  }

});
</script>

<script>
/* ANIMATED NETWORK BACKGROUND */

const canvas=document.getElementById("network");
const ctx=canvas.getContext("2d");

let width,height,particles=[];
let animationFrame;

const mobile=window.innerWidth<600;
const particleCount=mobile?45:75;
const connectionDistance=mobile?85:115;

function resizeCanvas(){

  const dpr=Math.min(window.devicePixelRatio||1,2);

  width=window.innerWidth;
  height=window.innerHeight;

  canvas.width=width*dpr;
  canvas.height=height*dpr;

  canvas.style.width=width+"px";
  canvas.style.height=height+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

}

function createParticles(){

  particles=[];

  for(let i=0;i<particleCount;i++){

    particles.push({
      x:Math.random()*width,
      y:Math.random()*height,
      vx:(Math.random()-.5)*.45,
      vy:(Math.random()-.5)*.45,
      radius:Math.random()*1.5+.5
    });

  }

}

function animate(){

  ctx.clearRect(0,0,width,height);

  for(let i=0;i<particles.length;i++){

    const p=particles[i];

    for(let j=i+1;j<particles.length;j++){

      const q=particles[j];

      const dx=p.x-q.x;
      const dy=p.y-q.y;
      const distance=Math.sqrt(dx*dx+dy*dy);

      if(distance<connectionDistance){

        const opacity=(1-distance/connectionDistance)*.4;

        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(q.x,q.y);
        ctx.strokeStyle=`rgba(65,190,255,${opacity})`;
        ctx.lineWidth=.6;
        ctx.stroke();

      }

    }

  }

  particles.forEach(p=>{

    p.x+=p.vx;
    p.y+=p.vy;

    if(p.x<0||p.x>width)p.vx*=-1;
    if(p.y<0||p.y>height)p.vy*=-1;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
    ctx.fillStyle="rgba(105,225,255,.85)";
    ctx.shadowBlur=10;
    ctx.shadowColor="#35aaff";
    ctx.fill();
    ctx.shadowBlur=0;

  });

  animationFrame=requestAnimationFrame(animate);

}

function startAnimation(){

  resizeCanvas();
  createParticles();

  if(animationFrame){
    cancelAnimationFrame(animationFrame);
  }

  animate();

}

window.addEventListener("resize",startAnimation);

startAnimation();
</script>

</body>
</html>

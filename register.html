<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | SIRI</title>

  <style>
    :root {
      --green: #20c77b;
      --green-light: #65f2b1;
      --navy: #061321;
      --navy-light: #0c2033;
      --white: #ffffff;
      --muted: #9aafc3;
      --danger: #ff7777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 35px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    #networkCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: .35;
    }

    .container {
      width: 100%;
      max-width: 510px;
      padding: 35px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      background: rgba(9, 28, 46, .94);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      color: var(--green-light);
      font-size: 30px;
      letter-spacing: 3px;
      margin-bottom: 7px;
    }

    .brand p {
      color: var(--muted);
      font-size: 13px;
    }

    .brand .subtitle {
      margin-top: 15px;
      color: var(--white);
      font-size: 20px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce8f5;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 12px 13px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      outline: none;
      background: rgba(3,15,28,.8);
      color: var(--white);
      font-size: 14px;
    }

    input:focus,
    select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(32,199,123,.12);
    }

    select option {
      background: var(--navy-light);
      color: var(--white);
    }

    .hint {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: var(--green-light);
      font-size: 11px;
      cursor: pointer;
    }

    .affiliation-heading {
      margin-bottom: 8px;
    }

    .affiliation-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .affiliation-option {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      padding: 13px 11px;
      min-height: 45px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: rgba(3,15,28,.65);
      color: #dce8f5;
      font-size: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .affiliation-option:has(input:checked) {
      border-color: var(--green);
      background: rgba(32,199,123,.12);
      color: var(--green-light);
    }

    .affiliation-option input {
      width: 16px;
      height: 16px;
      min-height: auto;
      margin: 0;
      padding: 0;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

    .affiliation-option input:disabled {
      cursor: not-allowed;
      opacity: .4;
    }

    #affiliationCount {
      margin-top: 10px;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #ffaaaa;
      background: rgba(255,80,80,.1);
      border: 1px solid rgba(255,80,80,.2);
    }

    .message.success {
      display: block;
      color: var(--green-light);
      background: rgba(32,199,123,.1);
      border: 1px solid rgba(32,199,123,.2);
    }

    .register-button {
      width: 100%;
      min-height: 49px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: var(--green);
      color: #04170e;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .register-button:hover {
      background: var(--green-light);
      transform: translateY(-1px);
    }

    .register-button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .bottom-text {
      margin-top: 23px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .bottom-text a {
      color: var(--green-light);
      text-decoration: none;
      font-weight: 600;
    }

    @media(max-width:520px) {
      body {
        padding: 20px 12px;
      }

      .container {
        padding: 25px 19px;
      }

      .brand h1 {
        font-size: 26px;
      }

      .affiliation-options {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <canvas id="networkCanvas"></canvas>

  <main class="container">

    <header class="brand">
      <h1>SIRI</h1>
      <p>SOBO Research &amp; Intelligence Hub</p>
      <div class="subtitle">Student Registration</div>
      <p>Register to access the SIRI platform.</p>
    </header>

    <form id="registrationForm">

      <div class="form-group">
        <label for="registrationNumber">Registration Number</label>
        <input
          type="text"
          id="registrationNumber"
          placeholder="Enter your registration number"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="year">Year of Study</label>
        <select id="year" required>
          <option value="">Select your year of study</option>
          <option value="1">Year 1</option>
          <option value="2">Year 2</option>
          <option value="3">Year 3</option>
          <option value="4">Year 4</option>
        </select>
      </div>

      <div class="form-group">
        <label for="course">Programme</label>
        <select id="course" required>
          <option value="">Select your programme</option>
          <option value="B.Com">Bachelor of Commerce (B.Com)</option>
          <option value="PPM">Project Planning and Management (PPM)</option>
        </select>
      </div>

      <!-- ASSOCIATION AFFILIATION -->
      <div class="form-group">
        <div class="affiliation-heading">
          <label>Association Affiliation</label>
          <p class="hint">
            Select at least one association. You may select a maximum of two.
          </p>
        </div>

        <div class="affiliation-options" id="affiliationOptions">

          <label class="affiliation-option">
            <input type="checkbox" name="affiliations" value="FISA">
            FISA
          </label>

          <label class="affiliation-option">
            <input type="checkbox" name="affiliations" value="ASA">
            ASA
          </label>

          <label class="affiliation-option">
            <input type="checkbox" name="affiliations" value="MSA">
            MSA
          </label>

          <label class="affiliation-option">
            <input type="checkbox" name="affiliations" value="UNISA">
            UNISA
          </label>

          <label class="affiliation-option">
            <input type="checkbox" name="affiliations" value="PMSA">
            PMSA
          </label>

          <label class="affiliation-option">
            <input type="checkbox" name="affiliations" value="HRSA">
            HRSA
          </label>

          <label class="affiliation-option">
            <input type="checkbox" name="affiliations" value="BISSA">
            BISSA
          </label>

          <label class="affiliation-option">
            <input type="checkbox" name="affiliations" value="NONE">
            Not affiliated
          </label>

        </div>

        <p id="affiliationCount" class="hint">
          0 of 2 associations selected.
        </p>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="07XXXXXXXX"
          pattern="07[0-9]{8}"
          maxlength="10"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Create Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            minlength="8"
            autocomplete="new-password"
            required
          >
          <button type="button" class="toggle-password" data-target="password">
            Show
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter your password"
            minlength="8"
            autocomplete="new-password"
            required
          >
          <button type="button" class="toggle-password" data-target="confirmPassword">
            Show
          </button>
        </div>
      </div>

      <div id="message" class="message" role="alert"></div>

      <button type="submit" id="registerButton" class="register-button">
        Create Account
      </button>

    </form>

    <div class="bottom-text">
      Already registered?
      <a id="loginLink" href="login.html">Login here</a>
    </div>

  </main>

  <script type="module">
    import { auth, db } from "./js/firebase.js";

    import {
      createUserWithEmailAndPassword,
      deleteUser
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    import {
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";


    const form = document.getElementById("registrationForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");

    // ASSOCIATION SELECTION
    const affiliationCheckboxes = [
      ...document.querySelectorAll('input[name="affiliations"]')
    ];

    const affiliationCount = document.getElementById("affiliationCount");

    function updateAffiliations() {
      const selected = affiliationCheckboxes.filter(
        checkbox => checkbox.checked
      );

      const hasNone = selected.some(
        checkbox => checkbox.value === "NONE"
      );

      affiliationCheckboxes.forEach(checkbox => {
        if (hasNone && checkbox.value !== "NONE") {
          checkbox.disabled = true;
        } else if (
          !hasNone &&
          checkbox.value === "NONE"
        ) {
          checkbox.disabled = selected.length > 0;
        } else {
          checkbox.disabled =
            !checkbox.checked && selected.length >= 2;
        }
      });

      affiliationCount.textContent =
        `${selected.length} of 2 associations selected.`;
    }

    affiliationCheckboxes.forEach(checkbox => {
      checkbox.addEventListener("change", updateAffiliations);
    });

    updateAffiliations();


    // PASSWORD VISIBILITY
    document.querySelectorAll(".toggle-password").forEach(toggle => {
      toggle.addEventListener("click", () => {
        const input = document.getElementById(toggle.dataset.target);

        if (input.type === "password") {
          input.type = "text";
          toggle.textContent = "Hide";
        } else {
          input.type = "password";
          toggle.textContent = "Show";
        }
      });
    });


    // MESSAGE HANDLING
    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }


    // REGISTRATION DESTINATION
    function getRegistrationDestination() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");

      if (next) {
        try {
          const destination = new URL(next, window.location.origin);

          if (
            destination.origin === window.location.origin &&
            destination.pathname.endsWith("/poll.html")
          ) {
            return destination.pathname + destination.search;
          }
        } catch (error) {
          // Use the default destination.
        }
      }

      return "dashboard.html";
    }


    // INTERNAL EMAIL GENERATION
    async function createInternalEmail(registrationNumber) {
      const normalized = registrationNumber.trim().toUpperCase();

      const encoded = new TextEncoder().encode(normalized);

      const hashBuffer = await crypto.subtle.digest("SHA-256", encoded);

      const hashArray = Array.from(new Uint8Array(hashBuffer));

      const hashString = hashArray
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");

      return `student-${hashString}@accounts.siri.invalid`;
    }


    // LOGIN LINK PRESERVES DESTINATION
    const params = new URLSearchParams(window.location.search);
    const next = params.get("next");

    if (next) {
      document.getElementById("loginLink").href =
        `login.html?next=${encodeURIComponent(next)}`;
    }


    // FORM SUBMISSION
    form.addEventListener("submit", async event => {
      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const registrationNumber =
        document.getElementById("registrationNumber").value.trim();

      const year =
        document.getElementById("year").value;

      const course =
        document.getElementById("course").value;

      const affiliations = affiliationCheckboxes
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);

      const phone =
        document.getElementById("phone").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      // VALIDATION
      if (!registrationNumber) {
        showMessage("Enter your registration number.", "error");
        return;
      }

      if (!["1", "2", "3", "4"].includes(year)) {
        showMessage("Select your year of study.", "error");
        return;
      }

      if (!["B.Com", "PPM"].includes(course)) {
        showMessage("Select your programme.", "error");
        return;
      }

      if (
        affiliations.length < 1 ||
        affiliations.length > 2
      ) {
        showMessage(
          "Select at least one association and no more than two.",
          "error"
        );
        return;
      }

      if (
        affiliations.includes("NONE") &&
        affiliations.length !== 1
      ) {
        showMessage(
          "Not affiliated cannot be combined with another association.",
          "error"
        );
        return;
      }

      if (!/^07[0-9]{8}$/.test(phone)) {
        showMessage(
          "Enter a valid phone number beginning with 07.",
          "error"
        );
        return;
      }

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", "error");
        return;
      }


      // CREATE ACCOUNT
      button.disabled = true;
      button.textContent = "Creating account...";

      let createdUser = null;

      try {
        const internalEmail =
          await createInternalEmail(registrationNumber);

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            internalEmail,
            password
          );

        createdUser = userCredential.user;


        // SAVE REGISTRATION INFORMATION
        await setDoc(
          doc(db, "registrationRequests", createdUser.uid),
          {
            uid: createdUser.uid,
            registrationNumber: registrationNumber,
            year: year,
            course: course,
            affiliations: affiliations,
            phone: "+254" + phone.substring(1),
            status: "active",
            createdAt: serverTimestamp()
          }
        );


        showMessage(
          "Registration successful. Redirecting...",
          "success"
        );

        window.location.href = getRegistrationDestination();

      } catch (error) {
        console.error("Registration error:", error);

        // CLEAN UP AUTH ACCOUNT IF PROFILE CREATION FAILS
        if (createdUser) {
          try {
            await deleteUser(createdUser);
          } catch (cleanupError) {
            console.error("Account cleanup error:", cleanupError);
          }
        }

        let errorMessage =
          "Registration failed. Please try again.";

        if (error.code === "auth/email-already-in-use") {
          errorMessage =
            "This registration number may already be registered. Please log in.";
        } else if (error.code === "auth/weak-password") {
          errorMessage =
            "Your password is too weak. Use at least 8 characters.";
        } else if (error.code === "auth/operation-not-allowed") {
          errorMessage =
            "Registration is currently unavailable. Contact the SIRI administrator.";
        } else if (
          error.code === "permission-denied" ||
          error.code === "firestore/permission-denied"
        ) {
          errorMessage =
            "Your registration could not be saved. Please contact the SIRI administrator.";
        } else if (
          error.code === "auth/network-request-failed"
        ) {
          errorMessage =
            "Network error. Check your internet connection and try again.";
        }

        showMessage(errorMessage, "error");

      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });

  </script>


  <!-- ANIMATED NETWORK BACKGROUND -->
  <script>
    const canvas = document.getElementById("networkCanvas");
    const ctx = canvas.getContext("2d");

    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      particles = [];

      const count = Math.min(
        65,
        Math.floor(window.innerWidth / 18)
      );

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4
        });
      }
    }

    function animateNetwork() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((particle, index) => {
        particle.x += particle.vx;
        particle.y += particle.vy;

        if (particle.x < 0 || particle.x > canvas.width) {
          particle.vx *= -1;
        }

        if (particle.y < 0 || particle.y > canvas.height) {
          particle.vy *= -1;
        }

        ctx.beginPath();
        ctx.arc(particle.x, particle.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = "#20c77b";
        ctx.fill();

        for (let j = index + 1; j < particles.length; j++) {
          const other = particles[j];

          const dx = particle.x - other.x;
          const dy = particle.y - other.y;

          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 115) {
            ctx.beginPath();
            ctx.moveTo(particle.x, particle.y);
            ctx.lineTo(other.x, other.y);
            ctx.strokeStyle =
              `rgba(32,199,123,${1 - distance / 115})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      });

      requestAnimationFrame(animateNetwork);
    }

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    animateNetwork();
  </script>

</body>
</html>
